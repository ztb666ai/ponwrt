name: Build XG-040G-MF UBI

on:
  workflow_dispatch:
    inputs:
      config_only:
        description: "仅验证配置，不编译固件。"
        required: false
        default: false
        type: boolean
env:
  TARGET_DEVICE: nokia_xg-040g-mf-ubi   # 想编哪个设备，只改这一行

permissions:
  contents: write

concurrency:
  group: xg040gmf-build
  cancel-in-progress: false

jobs:
  build:
    name: Build Nokia XG-040G-MF UBI
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      # ============================================================
      # 1. Checkout fork master
      # ============================================================

      - name: Checkout fork master
        uses: actions/checkout@v6
        with:
          ref: master
          fetch-depth: 0

      # ============================================================
      # 2. Sync latest pbs05/ponwrt master before every build
      # ============================================================

      - name: Sync latest upstream PonWrt
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git remote remove upstream 2>/dev/null || true
          git remote add upstream https://github.com/pbs05/ponwrt.git

          echo "========== Fetch upstream =========="
          git fetch upstream master

          echo "========== Latest upstream commit =========="
          git log -1 --oneline upstream/master

          git checkout master
          git reset --hard upstream/master
          git clean -fdx

          echo "========== Sync fork master =========="
          git push origin HEAD:master --force

          echo "========== Actual build source =========="
          git log -1 --oneline

      # ============================================================
      # 3. Free runner space
      # ============================================================

      - name: Free build space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo apt-get clean

      # ============================================================
      # 4. Host build dependencies
      # ============================================================

      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update

          sudo apt-get install -y --no-install-recommends \
            asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache clang cmake cpio curl device-tree-compiler flex gawk \
            gettext git g++-multilib gcc-multilib gperf help2man intltool \
            libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev \
            libmpfr-dev libncurses-dev libpython3-dev libreadline-dev libssl-dev \
            libtool libyaml-dev lld llvm ninja-build p7zip-full patch pkgconf \
            python3 python3-docutils python3-pip python3-ply python3-pyelftools \
            qemu-utils re2c rsync scons squashfs-tools subversion swig texinfo \
            uglifyjs unzip wget xmlto xxd zlib1g-dev zstd

      # ============================================================
      # 5. Download cache
      # ============================================================

      - name: Prepare download cache
        run: |
          mkdir -p dl

      - name: Cache downloads
        uses: actions/cache@v4
        with:
          path: dl
          key: ponwrt-xg040gmf-${{ hashFiles('feeds.conf.default', 'configs/an7583.config', 'configs/release.config') }}
          restore-keys: |
            ponwrt-xg040gmf-

      # ============================================================
      # 6. Third-party feeds
      # PassWall2 feeds are deliberately placed first
      # ============================================================

      - name: Configure official PassWall2 and iStore feeds
        shell: bash
        run: |
          set -euo pipefail

          grep -vE \
            '^src-git (passwall_packages|passwall2|istore) ' \
            feeds.conf.default \
            > /tmp/feeds.original

          cat > feeds.conf.default <<'EOF'
          src-git passwall_packages https://github.com/Openwrt-Passwall/openwrt-passwall-packages.git;main
          src-git passwall2 https://github.com/Openwrt-Passwall/openwrt-passwall2.git;main
          src-git istore https://github.com/linkease/istore;main
          EOF
          cat /tmp/feeds.original >> feeds.conf.default
#          echo "========== Feed order =========="
#          head -n 10 feeds.conf.default
#        test "$(sed -n '1p' feeds.conf.default)" = \
#            "src-git passwall_packages https://github.com/Openwrt-Passwall/openwrt-passwall-packages.git;main"
#         # test "$(sed -n '2p' feeds.conf.default)" = \
#            "src-git passwall2 https://github.com/Openwrt-Passwall/openwrt-passwall2.git;main"
#         # test "$(sed -n '3p' feeds.conf.default)" = \
#            "src-git istore https://github.com/linkease/istore;main"
#
#          echo "Feed priority OK."

      # ============================================================
      # 7. Update/install feeds
      # ============================================================

      - name: Update and install feeds
        shell: bash
        run: |
          set -euo pipefail

          ./scripts/feeds update -a
          ./scripts/feeds install -a
      # ============================================================
      # 7.7 USB auto-mount to /opt (Docker data-root)
      # ============================================================
      - name: Generate USB auto-mount overlay (/opt)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p files/usr/bin files/etc/hotplug.d/block files/etc/uci-defaults

          # ---- 1) 挂载/卸载辅助脚本 ----
          cat > files/usr/bin/mount-opt <<'EOF'
          #!/bin/sh
          # 将第一个未挂载的 USB/SD 分区挂载到 /opt
          MOUNT_POINT="/opt"

          do_mount() {
            local dev
            mkdir -p "$MOUNT_POINT"
            # /opt 已被占用则不重复挂
            grep -qs " ${MOUNT_POINT} " /proc/mounts && return 0
            for dev in /dev/sd[a-z][0-9]* /dev/mmcblk[0-9]p[0-9]*; do
              [ -b "$dev" ] || continue
              grep -qs "^${dev} " /proc/mounts && continue
              logger -t mount-opt "mounting ${dev} -> ${MOUNT_POINT}"
              mount -o rw,noatime "$dev" "$MOUNT_POINT" && return 0
            done
            return 1
          }

          do_umount() {
            local dev="${1}"
            grep -qs "^${dev} ${MOUNT_POINT} " /proc/mounts && umount "$MOUNT_POINT"
          }

          case "$1" in
            mount)  do_mount ;;
            umount) do_umount "$2" ;;
            *) echo "usage: $0 mount|umount [dev]" ;;
          esac
          EOF
          chmod +x files/usr/bin/mount-opt

          # ---- 2) hotplug: 开机冷插拔 + 运行期热插拔 ----
          cat > files/etc/hotplug.d/block/40-mount-opt <<'EOF'
          case "$ACTION" in
            add)
              case "$DEVNAME" in
                sd[a-z][0-9]*|mmcblk[0-9]p[0-9]*)
                  # 后台执行避免阻塞 hotplug 队列; 等 1s 让设备节点就绪
                  ( sleep 1; /usr/bin/mount-opt mount ) &
                  ;;
              esac
              ;;
            remove)
              case "$DEVNAME" in
                sd[a-z][0-9]*|mmcblk[0-9]p[0-9]*)
                  /usr/bin/mount-opt umount "/dev/$DEVNAME"
                  ;;
              esac
              ;;
          esac
          EOF

          # ---- 3) 首次开机: 禁用 blockd, 并提前完成挂载 ----
          cat > files/etc/uci-defaults/99-mount-opt <<'EOF'
          # blockd 会把 U 盘自动挂到 /mnt/sda1, 与 /opt 冲突, 禁用之
          [ -x /etc/init.d/blockd ] && /etc/init.d/blockd disable

          mkdir -p /opt

          # S10 时 kmodloader 已加载 usb-storage, 稍等设备枚举后挂载
          (
            n=0
            while [ "$n" -lt 10 ] && ! /usr/bin/mount-opt mount; do
              sleep 1
              n=$((n+1))
            done
          ) &

          exit 0
          EOF
          chmod +x files/etc/uci-defaults/99-mount-opt

          echo "USB auto-mount overlay generated."

     
      # ============================================================
      # 8. Verify package sources
      # ============================================================

      - name: Verify package sources
        shell: bash
        run: |
          set -euo pipefail

          echo "========== iStore =========="
          test -f package/feeds/istore/luci-app-store/Makefile
          echo "iStore source OK."


      # ============================================================
      # 9. Signing key
      # ============================================================

      - name: Load repository signing key
        env:
          PONWRT_APK_PRIVATE_KEY: ${{ secrets.PONWRT_APK_PRIVATE_KEY }}
        run: |
          if [ -n "$PONWRT_APK_PRIVATE_KEY" ]; then
            umask 077

            printf '%s\n' \
              "$PONWRT_APK_PRIVATE_KEY" \
              > private-key.pem

            openssl ec \
              -in private-key.pem \
              -pubout \
              -out public-key.pem
          fi
      # ============================================================
      # 10. Default LAN IP + hostname + timezone (UTC+8)
      # ============================================================
      - name: Set default LAN IP, hostname and timezone
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import re
          from pathlib import Path

          path = Path("package/base-files/files/bin/config_generate")
          s = path.read_text()

          def must_replace(pattern, repl, label):
                global s
                s2, n = re.subn(pattern, repl, s, count=1)
                if n != 1:
                    raise SystemExit(f"ERROR: config_generate patch failed: {label}")
                s = s2

          must_replace(
                r'lan\) ipad=\$\{ipaddr:-"192\.168\.1\.1"\} ;;',
                'lan) ipad=${ipaddr:-"192.168.2.1"} ;;',
                "lan ip",
            )
          must_replace(
                r"(set system\.@system\[-1\]\.hostname=)'[^']*'",
                r"\g<1>'PonWrt'",
                "hostname",
            )
          must_replace(
                r"(set system\.@system\[-1\]\.timezone=)'[^']*'",
                r"\g<1>'CST-8'",
                "timezone",
            )
          must_replace(
                r"(set system\.@system\[-1\]\.zonename=)'[^']*'",
                r"\g<1>'Asia/Shanghai'",
                "zonename",
            )

          path.write_text(s)
          print("config_generate patched OK")
          PY
          grep -n "PonWrt" package/base-files/files/bin/config_generate
          grep -n "CST-8" package/base-files/files/bin/config_generate
          grep -n "Asia/Shanghai" package/base-files/files/bin/config_generate
          grep -n "192.168.2.1" package/base-files/files/bin/config_generate
      # ============================================================
      # 10.5 Force China timezone overlay (UTC+8)
      # ============================================================
      - name: Generate China timezone uci-defaults overlay
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p files/etc/uci-defaults
          cat > files/etc/uci-defaults/99-timezone-cn <<'EOF'
            #!/bin/sh
            # Force China timezone (UTC+8) on every flash / keep-settings upgrade
            [ -s /etc/config/system ] || exit 0
            uci -q set system.@system[0].zonename='Asia/Shanghai'
            uci -q set system.@system[0].timezone='CST-8'
            uci -q commit system
            exit 0
          EOF
          chmod +x files/etc/uci-defaults/99-timezone-cn
          echo "========== 99-timezone-cn =========="
          cat files/etc/uci-defaults/99-timezone-cn
      # ============================================================
      # 10.6 Keep USB VBUS always-on (fix U-disk power cut @ ~34s)
      # MF DTS 的 usb-5v 固定稳压器既没有 regulator-always-on，
      # xhci 节点也没绑 vbus-supply，内核 late-cleanup 会把没有
      # consumer 的 regulator 关掉（dmesg: "usb-5v: disabling"），
      # 导致 U 盘开机约 30 秒后断电掉线。这里补 always-on。
      # 幂等：已打过补丁则跳过。
      # ============================================================
      #- name: Patch MF DTS - keep usb-5v regulator always-on
      #  shell: bash
      #  run: |
      #    set -euo pipefail
      #    DTS_FILE=$(grep -rl 'usb-5v' \
      #      target/linux/airoha/files*/arch/arm64/boot/dts/airoha/ \
      #      2>/dev/null | head -n1 || true)
      #    if [ -z "$DTS_FILE" ]; then
      #      echo "ERROR: MF DTS containing 'usb-5v' not found"
      #      grep -rn 'usb-5v' target/linux/airoha/ | head -20
      #      exit 1
      #    fi
      #    echo "Patching: ${DTS_FILE}"
      #    grep -q 'usb-5v' "$DTS_FILE"
      #    python3 - "$DTS_FILE" <<'PY'
      #    import re, sys
      #    p = sys.argv[1]
      #    s = open(p).read()
      #    # 定位引用 usb-5v 字符串的 regulator-fixed 节点块
      #    pat = re.compile(r'(\w+:\s*regulator-[a-z0-9-]+\s*\{[^{}]*?usb-5v[^{}]*?)(\})', re.S)
      #    m = pat.search(s)
      #    if not m:
      #        raise SystemExit("ERROR: usb-5v regulator node not found in DTS")
      #    block = m.group(1)
      #    if 'regulator-always-on' in block:
      #        print("already patched, skip")
      #    else:
      #        s = s[:m.start()] + block + '\n\t\tregulator-always-on;\n\t\tregulator-boot-on;\n' + m.group(2) + s[m.end():]
      #        open(p, 'w').write(s)
      #        print("patched: regulator-always-on/boot-on added to usb-5v")
      #    PY
      #    grep -n -A8 'usb-5v' "$DTS_FILE" | head -20
    
      # ============================================================
      # 10.7 Runtime kernel patches（不改 git 源，构建时动态打补丁）
      #  P1: LWN crypto 动态软件回退 + EIP93（4 个内核补丁，Linux 6.18）
      #  P2: OpenWrt c46bef18 桥接 flow 软转发修复（pending-6.18 单文件）
      # 两者都在内核 prepare 阶段由 quilt 自动应用，无需 commit。
      # 幂等：已存在/已应用则跳过。
      # ============================================================
      - name: Apply kernel patches (EIP93 fallback + bridge flow fix)
        shell: bash
        run: |
          set -euo pipefail
          KV=$(sed -n 's/^KERNEL_PATCHVER:=//p' target/linux/airoha/Makefile)
          echo "KERNEL_PATCHVER = ${KV}"
          [ "${KV}" = "6.18" ] || { echo "ERROR: 两个补丁都基于 Linux 6.18，当前树是 ${KV}"; exit 1; }

          # ---------- P1: LWN 系列（lore linux-crypto 线程 mbox，顺序有保证） ----------
          AIRD=target/linux/airoha/patches-${KV}
          if ! compgen -G "${AIRD}/999-*-crypto-dynamic-fallback*.patch" >/dev/null; then
            mkdir -p "${AIRD}" /tmp/lwn && rm -f /tmp/lwn/*
            curl -fsSL --retry 3 \
              'https://lore.kernel.org/linux-crypto/cover.1785226804.git.hurryman2212@gmail.com/t.mbox.gz' \
              | gzip -dc > /tmp/lwn/series.mbox
            git mailsplit -o/tmp/lwn /tmp/lwn/series.mbox >/dev/null
            n=0
            for f in /tmp/lwn/0*; do
              [ "$(basename "$f")" = "0001" ] && continue      # 跳过 cover letter
              n=$((n+1))
              cp -v "$f" "${AIRD}/999-$(printf '%02d' $n)-crypto-dynamic-fallback.patch"
            done
            [ "${n}" -eq 4 ] || { echo "ERROR: 期望 4 个补丁，实际 ${n} 个"; exit 1; }
          fi
          ls -l "${AIRD}"/999-*.patch
          head -n4 "${AIRD}"/999-01-*.patch                    # 日志确认 Subject

          # ---------- P2: OpenWrt master commit（固定 sha，可复现） ----------
          P2=target/linux/generic/pending-${KV}/675-15-netfilter-fix-bridge-flow-software-forwarding.patch
          if ! grep -rqs 'netfilter: make bridge flow offload preserve L2 forwarding' \
                target/linux/generic/pending-${KV}/ ; then     # 查重：上游已收编则跳过
            mkdir -p "$(dirname "${P2}")"
            curl -fsSL --retry 3 \
              'https://raw.githubusercontent.com/openwrt/openwrt/c46bef18699833af759b6b7f71879ed8c23852c1/target/linux/generic/pending-6.18/675-15-netfilter-fix-bridge-flow-software-forwarding.patch' \
              -o "${P2}"
          fi
          head -n6 "${P2}"

          # ---------- 可选：内核侧使能 fallback 框架 ----------
          CFG=target/linux/airoha/config-${KV}
          grep -qs '^CONFIG_CRYPTO_DYNAMIC_FALLBACK=y' "${CFG}" || {
            echo 'CONFIG_CRYPTO_DYNAMIC_FALLBACK=y' >> "${CFG}"
            echo "appended CONFIG_CRYPTO_DYNAMIC_FALLBACK=y"
          }
          echo "Kernel patches prepared."

      # ============================================================
      # 12. Custom configuration
      # ============================================================

      - name: Create XG-040G-MF custom config
        run: |
          cat > /tmp/xg040gmf.config <<'EOF'

          # ========================================================
          #CONFIG_TARGET_DEVICE_airoha_an7583_DEVICE_nokia_xg-040g-mf=y
          #CONFIG_TARGET_DEVICE_PACKAGES_airoha_an7583_DEVICE_nokia_xg-040g-mf=""
          CONFIG_TARGET_DEVICE_airoha_an7583_DEVICE_nokia_xg-040g-mf-ubi=y
          CONFIG_TARGET_DEVICE_PACKAGES_airoha_an7583_DEVICE_nokia_xg-040g-mf-ubi=""
          # ========================================================
          # TIMEZONE - zoneinfo database (Asia/Shanghai for LuCI/apps)
          # ========================================================
          CONFIG_PACKAGE_zoneinfo-asia=y

          # ========================================================
          # OPENCLASH DISABLED
          # ========================================================

          # CONFIG_PACKAGE_luci-app-openclash is not set

          # ========================================================
          # PASSWALL V1 DISABLED
          # ========================================================

          # CONFIG_PACKAGE_luci-app-passwall is not set

          # ========================================================
          # ISTORE
          # ========================================================

          #CONFIG_PACKAGE_luci-app-store=y
          #CONFIG_PACKAGE_xz-utils=y
   
          # ========================================================
          # WIREGUARD DISABLED (override release.config)
          # ========================================================
          # CONFIG_PACKAGE_kmod-wireguard is not set
          # CONFIG_PACKAGE_wireguard-tools is not set
          # CONFIG_PACKAGE_luci-proto-wireguard is not set
          
          # ========================================================
          # UPNP DISABLED (override release.config)
          # ========================================================
          # CONFIG_PACKAGE_luci-app-upnp is not set
          # CONFIG_PACKAGE_miniupnpd is not set


          # ========================================================
          # PASSWALL2 - SingBox only + nftables
          # ========================================================

          #CONFIG_PACKAGE_luci-app-passwall2=y
          #CONFIG_PACKAGE_luci-i18n-passwall2-zh-cn=y

          # Basic core

          # CONFIG_PACKAGE_luci-app-passwall2_Basic_Core_Xray is not set
          #CONFIG_PACKAGE_luci-app-passwall2_Basic_Core_SingBox=y
          # CONFIG_PACKAGE_luci-app-passwall2_Basic_Core_All is not set

          # Transparent proxy

          # CONFIG_PACKAGE_luci-app-passwall2_Iptables_Transparent_Proxy is not set
          #CONFIG_PACKAGE_luci-app-passwall2_Nftables_Transparent_Proxy=y

          # Disable optional heavy / legacy components

          # CONFIG_PACKAGE_luci-app-passwall2_INCLUDE_Haproxy is not set

          # CONFIG_PACKAGE_luci-app-passwall2_INCLUDE_Shadowsocks_Rust_Client is not set
          # CONFIG_PACKAGE_luci-app-passwall2_INCLUDE_Shadowsocks_Rust_Server is not set

          # CONFIG_PACKAGE_luci-app-passwall2_INCLUDE_ShadowsocksR_Libev_Client is not set
          # CONFIG_PACKAGE_luci-app-passwall2_INCLUDE_ShadowsocksR_Libev_Server is not set

          # CONFIG_PACKAGE_luci-app-passwall2_INCLUDE_Simple_Obfs is not set
          # CONFIG_PACKAGE_luci-app-passwall2_INCLUDE_V2ray_Plugin is not set

          # ========================================================
          # add-on apps
          # ========================================================

          CONFIG_PACKAGE_luci-app-iptv=y
          CONFIG_PACKAGE_udpxy=y
          CONFIG_PACKAGE_acme-acmesh-dnsapi=y
          CONFIG_PACKAGE_luci-app-acme=y
          CONFIG_PACKAGE_luci-ssl-openssl=y
          CONFIG_PACKAGE_luci-app-ddns-go=y
          CONFIG_PACKAGE_luci-app-uhttpd=y
          CONFIG_PACKAGE_msmtp=y
          CONFIG_PACKAGE_msmtp-mta=y
          CONFIG_PACKAGE_mutt=y
          CONFIG_PACKAGE_vim-fuller=y
          CONFIG_PACKAGE_luci-app-cloudflared=y

          # ========================================================
          # CRITICAL DRIVERS -> =y (2.5G 网口 + USB 自动挂载)
          # 上游 release.config 把这些设成 m（不进固件），显式 =y 覆盖之
          # 依赖包（libphy/of-mdio/nls 等）由 make defconfig 自动补齐
          # ========================================================
          CONFIG_PACKAGE_kmod-airoha-en7572=y
          CONFIG_PACKAGE_kmod-phy-airoha-en8811h=y
          CONFIG_PACKAGE_airoha-en8811h-firmware=y
          CONFIG_PACKAGE_block-mount=y
          CONFIG_PACKAGE_kmod-usb-core=y
          CONFIG_PACKAGE_kmod-usb-common=y
          CONFIG_PACKAGE_kmod-usb-xhci-hcd=y
          CONFIG_PACKAGE_kmod-usb3=y
          CONFIG_PACKAGE_kmod-usb-storage=y
          CONFIG_PACKAGE_kmod-usb-storage-uas=y
          CONFIG_PACKAGE_kmod-scsi-core=y
          CONFIG_PACKAGE_kmod-fs-ext4=y
          CONFIG_PACKAGE_kmod-fs-vfat=y
          CONFIG_PACKAGE_kmod-fs-exfat=y
          CONFIG_PACKAGE_kmod-nls-base=y
          CONFIG_PACKAGE_kmod-nls-cp437=y
          CONFIG_PACKAGE_kmod-nls-iso8859-1=y
          CONFIG_PACKAGE_kmod-nls-utf8=y
          CONFIG_PACKAGE_kmod-phy-maxlinear=y
          CONFIG_PACKAGE_kmod-phy-realtek=y
          CONFIG_PACKAGE_kmod-crypto-hw-eip93=y
          # 让 usb-power(regulator-output) 节点有驱动认领，防止 usb-5v 被
          # regulator late-cleanup 关闭（与 MD 行为完全一致）
          CONFIG_PACKAGE_kmod-regulator-userspace-consumer=y
          # APK 仓库基址改为 NJU 镜像（distfeeds.list 的 %U 占位符来源）
          CONFIG_VERSION_REPO="https://mirror.nju.edu.cn/immortalwrt/snapshots"

          EOF

      # ============================================================
      # 13. Merge configuration
      # ============================================================

      - name: Configure XG-040G-MF
        shell: bash
        run: |
          set -euo pipefail

          ./scripts/kconfig.pl + \
            configs/an7583.config \
            + \
            configs/release.config \
            /tmp/xg040gmf.config \
            > .config
          make defconfig
      # ============================================================
      # 14. Whitelist device， compile specified device
      # ============================================================
      - name: Whitelist device (${{ env.TARGET_DEVICE }})
        env:
          DEVICE: ${{ env.TARGET_DEVICE }}
        shell: bash
        run: |
          set -euo pipefail
          [ -n "$DEVICE" ] || { echo "ERROR: TARGET_DEVICE is empty"; exit 1; }
          DEV_ESC=$(printf '%s' "$DEVICE" | sed -e 's/[^A-Za-z0-9_-]/\\&/g')
          sed -i -E 's/^(CONFIG_TARGET_[A-Za-z0-9_]+_DEVICE_[A-Za-z0-9_.-]+)=y$/# \1 is not set/' .config
          grep -qE "^# CONFIG_TARGET_[A-Za-z0-9_]+_DEVICE_${DEV_ESC} is not set$" .config || { echo "ERROR: device symbol for ${DEVICE} not found in .config"; exit 1; }
          sed -i -E "s/^# (CONFIG_TARGET_[A-Za-z0-9_]+_DEVICE_${DEV_ESC}) is not set$/\1=y/" .config
          make defconfig
          remaining=$(grep -cE '^CONFIG_TARGET_[A-Za-z0-9_]+_DEVICE_[A-Za-z0-9_.-]+=y$' .config || true)
          [ "$remaining" -eq 1 ] || { echo "ERROR: expect exactly 1 DEVICE=y, got ${remaining}"; exit 1; }
          grep -E "^CONFIG_TARGET_[A-Za-z0-9_]+_DEVICE_${DEV_ESC}=y$" .config
          echo "Whitelist OK: only ${DEVICE} enabled."
      
      # ============================================================
      # 15. Config-only test mode
      # ============================================================

      - name: Upload build config
        if: ${{ inputs.config_only }}
        uses: actions/upload-artifact@v4
        with:
          name: xg040gmf-build-config
          path: .config
          include-hidden-files: true
          retention-days: 7

      # ============================================================
      # 16. Download sources
      # ============================================================

      - name: Download sources
        if: ${{ !inputs.config_only }}
        run: |
          make download -j"$(nproc)"

      # ============================================================
      # 17. Build
      # ============================================================

      - name: Build firmware
        if: ${{ !inputs.config_only }}
        run: |
          make -j"$(nproc)"

      # ============================================================
      # 18. Verify actual firmware manifest
      # ============================================================

      - name: Verify firmware package manifest
        if: ${{ !inputs.config_only }}
        shell: bash
        run: |
          set -euo pipefail

          target_dir="bin/targets/airoha/an7583"

          echo "========== Target output =========="
          ls -lah "$target_dir"

          mapfile -t manifests < <(
            find "$target_dir" \
              -maxdepth 1 \
              -type f \
              -name '*.manifest' \
              -print
          )

          if [ "${#manifests[@]}" -ne 1 ]; then
            echo "ERROR: expected exactly one device manifest."
            echo "Found ${#manifests[@]}."
            printf '%s\n' "${manifests[@]}"
            exit 1
          fi

          manifest="${manifests[0]}"

          echo "========== Manifest =========="
          echo "$manifest"

          for pkg in \
            luci-app-pon \
            airoha-ponctl \
            airoha-pond \
            luci-app-iptv 
          do
            if ! grep -q "^${pkg} " "$manifest"; then
              echo "ERROR: firmware manifest is missing package: ${pkg}"
              exit 1
            fi
          done

          #if grep -q '^luci-app-openclash ' "$manifest"; then
          #  echo "ERROR: OpenClash unexpectedly exists in firmware."
          #  exit 1
          #fi

          echo "Actual firmware package manifest OK."

      # ============================================================
      # 19. Collect exactly one sysupgrade.itb
      # ============================================================

      - name: Collect XG-040G-MF firmware
        if: ${{ !inputs.config_only }}
        shell: bash
        run: |
          set -euo pipefail

          rm -rf release
          mkdir -p release

          target_dir="bin/targets/airoha/an7583"

          mapfile -t firmware_files < <(
            find "$target_dir" \
              -maxdepth 1 \
              -type f \
              -name '*sysupgrade.itb' \
              -print
          )

          echo "========== sysupgrade.itb candidates =========="
          printf '%s\n' "${firmware_files[@]}"

          if [ "${#firmware_files[@]}" -ne 1 ]; then
            echo "ERROR: expected exactly one sysupgrade.itb."
            echo "Found ${#firmware_files[@]}."
            exit 1
          fi

          firmware="${firmware_files[0]}"

          if [ ! -s "$firmware" ]; then
            echo "ERROR: firmware is empty."
            exit 1
          fi

          cp -v "$firmware" release/

          # ---- 2) manifest ----
          mapfile -t manifests < <(
            find "$target_dir" \
              -maxdepth 1 \
              -type f \
              -name '*.manifest' \
              -print
          )
          if [ "${#manifests[@]}" -ne 1 ]; then
              echo "ERROR: expected exactly one manifest."
              echo "Found ${#manifests[@]}."
          fi
          cp -v "${manifests[0]}" release/

          # ---- 3) final .config (post defconfig + whitelist) ----
          if [ ! -s .config ]; then
            echo "ERROR: .config not found."
          #  exit 1
           fi
           cp -v .config release/xg040gmf.config

           echo "========== release/ =========="
           ls -lh release/

      # ============================================================
      # 20. Final firmware validation
      # ============================================================

      - name: Verify final firmware
        if: ${{ !inputs.config_only }}
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t final_files < <(
            find release \
              -maxdepth 1 \
              -type f \
              -name '*sysupgrade.itb' \
              -print
          )

          if [ "${#final_files[@]}" -ne 1 ]; then
            echo "ERROR: release directory must contain exactly one ITB."
            exit 1
          fi

          firmware="${final_files[0]}"

          test -s "$firmware"

          echo "========== Final firmware =========="
          ls -lh "$firmware"

          echo "========== SHA256 =========="
          sha256sum "$firmware"

      # ============================================================
      # 21. Publish ITB + manifest + config to GitHub Release
      # ============================================================
      - name: Publish artifacts to GitHub Release
        if: ${{ !inputs.config_only }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mapfile -t release_files < <(
            find release \
              -maxdepth 1 \
              -type f \
              \( -name '*sysupgrade.itb' \
              -o -name '*.manifest' \
              -o -name '*.config' \) \
              -print | sort
          )
          if [ "${#release_files[@]}" -ne 3 ]; then
             echo "ERROR: expected exactly 3 artifacts (itb + manifest + config)."
             echo "Found ${#release_files[@]}:"
             printf '%s\n' "${release_files[@]}"
             exit 1
          fi

          for f in "${release_files[@]}"; do
            test -s "$f" || { echo "ERROR: $f is empty"; exit 1; }
          done

          firmware="$(find release -maxdepth 1 -type f -name '*sysupgrade.itb')"
          manifest="$(find release -maxdepth 1 -type f -name '*.manifest')"
          config="release/xg040gmf.config"

          source_sha="$(git rev-parse HEAD)"
          short_sha="$(git rev-parse --short=8 HEAD)"
          release_tag="xg040gmf-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}-${short_sha}"

          firmware_sha256="$(sha256sum "$firmware" | awk '{print $1}')"
          manifest_sha256="$(sha256sum "$manifest" | awk '{print $1}')"
          config_sha256="$(sha256sum "$config" | awk '{print $1}')"

          echo "========== Release =========="
          echo "Tag: ${release_tag}"
          echo "Source: ${source_sha}"
          for f in "${release_files[@]}"; do
            echo "Asset: ${f}"
          done

          gh release create \
             "${release_tag}" \
             "${firmware}" \
             "${manifest}" \
             "${config}" \
             --repo "${GITHUB_REPOSITORY}" \
             --target "${source_sha}" \
             --title "Nokia XG-040G-MF ${short_sha}" \
             --notes "Nokia XG-040G-MF UBI sysupgrade firmware.

          Default LAN IP: 192.168.2.1
          Default hostname: PonWrt
          Timezone: Asia/Shanghai (UTC+8)
          Proxy: nftables
          Docker: N/A

          SHA256:
          \`\`\`
          ${firmware_sha256}  $(basename "$firmware")
          ${manifest_sha256}  $(basename "$manifest")
          ${config_sha256}  $(basename "$config")
          \`\`\`

          Source commit: ${source_sha}" \
            --prerelease

      # ============================================================
      # 22. Verify published Release
      # ============================================================
      - name: Verify published Release
        if: ${{ !inputs.config_only }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          short_sha="$(git rev-parse --short=8 HEAD)"
          release_tag="xg040gmf-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}-${short_sha}"
          mapfile -t assets < <(
            gh release view "${release_tag}" \
              --repo "${GITHUB_REPOSITORY}" \
              --json assets \
              --jq '.assets[].name'
          )

          echo "========== Assets =========="
          printf '%s\n' "${assets[@]}"
           if [ "${#assets[@]}" -ne 3 ]; then
            echo "ERROR: Release must contain exactly 3 assets."
            echo "Found: ${#assets[@]}"
            exit 1
          fi

          has_itb=0; has_manifest=0; has_config=0
          for name in "${assets[@]}"; do
            case "${name}" in
              *sysupgrade.itb) has_itb=1 ;;
              *.manifest)      has_manifest=1 ;;
              *.config)        has_config=1 ;;
              *) echo "ERROR: unexpected asset: ${name}"; exit 1 ;;
            esac
          done
          [ "$has_itb" -eq 1 ]      || { echo "ERROR: missing itb"; exit 1; }
          [ "$has_manifest" -eq 1 ] || { echo "ERROR: missing manifest"; exit 1; }
          [ "$has_config" -eq 1 ]   || { echo "ERROR: missing config"; exit 1; }
          echo "=========================================="
          echo "BUILD SUCCESS"
          echo "Assets: itb + manifest + config"
          echo "=========================================="
